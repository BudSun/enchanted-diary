<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Diary · Tom Riddle</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
  /* ====================================================================
     羊皮纸 + 暗调做旧。色板：
       parchment  #d9c39a  纸面主色
       shadow     #6e5430  阴影 / 旧渍
       ink        #1f1108  墨迹
       ember      #b8722b  烛光 / 装饰
       blood      #5a1a1a  暗红（警示/章节装饰）
     ==================================================================== */
  :root {
    --parchment: #d9c39a;
    --parchment-edge: #b89968;
    --shadow: #6e5430;
    --ink: #1f1108;
    --ember: #b8722b;
    --blood: #5a1a1a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0a0606;
    font-family: "Georgia", "STKaiti", "KaiTi", serif;
    color: var(--ink);
    user-select: none;
  }

  /* 烛光晕染背景，营造摇曳感 */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 25% 15%, rgba(184,114,43,0.18) 0%, transparent 55%),
      radial-gradient(circle at 75% 85%, rgba(184,114,43,0.10) 0%, transparent 60%),
      radial-gradient(circle at 50% 50%, rgba(0,0,0,0.55) 0%, transparent 70%);
    pointer-events: none;
    z-index: 1;
  }

  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  /* 羊皮纸卷本身 */
  #scroll {
    position: relative;
    width: min(94vw, 1100px);
    height: min(92vh, 900px);
    background:
      radial-gradient(ellipse at 30% 20%, rgba(110,84,48,0.35) 0%, transparent 55%),
      radial-gradient(ellipse at 75% 70%, rgba(110,84,48,0.28) 0%, transparent 50%),
      radial-gradient(ellipse at 10% 90%, rgba(90,26,26,0.18) 0%, transparent 50%),
      linear-gradient(180deg, #e2cda4 0%, var(--parchment) 35%, #cdb583 100%);
    border-radius: 6px;
    box-shadow:
      inset 0 0 80px rgba(110,84,48,0.55),
      inset 0 0 200px rgba(0,0,0,0.18),
      0 30px 80px rgba(0,0,0,0.7),
      0 0 0 1px rgba(110,84,48,0.4);
    overflow: hidden;
  }

  /* 纤维纹理（SVG noise） */
  #scroll::before {
    content: "";
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.42  0 0 0 0 0.32  0 0 0 0 0.18  0 0 0 0.14 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.7;
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  /* 边缘焦灼感 */
  #scroll::after {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, transparent 60%, rgba(60,30,10,0.35) 100%),
      radial-gradient(ellipse at 50% 100%, transparent 55%, rgba(60,30,10,0.45) 100%),
      radial-gradient(ellipse at 0% 50%, transparent 70%, rgba(60,30,10,0.30) 100%),
      radial-gradient(ellipse at 100% 50%, transparent 70%, rgba(60,30,10,0.30) 100%);
    pointer-events: none;
  }

  /* 顶部章节标题 */
  .header {
    position: absolute;
    top: 28px; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 5;
  }
  .header .rule {
    display: inline-block;
    font-family: "Georgia", serif;
    font-size: 11px;
    letter-spacing: 6px;
    color: var(--blood);
    opacity: 0.55;
  }
  .header .title {
    font-family: "Georgia", serif;
    font-style: italic;
    font-size: 22px;
    letter-spacing: 4px;
    color: var(--ink);
    margin-top: 4px;
  }
  .header .title::before, .header .title::after {
    content: "✦";
    color: var(--ember);
    margin: 0 10px;
    font-size: 14px;
    vertical-align: middle;
  }

  /* 主画布 */
  #ink-canvas {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    cursor: crosshair;
    touch-action: none;
    z-index: 3;
  }

  /* 回复手写层 */
  #reply-svg {
    position: absolute;
    inset: 50px 50px 40px 50px;
    width: calc(100% - 100px);
    height: calc(100% - 90px);
    z-index: 4;
    pointer-events: none;
    overflow: visible;
  }

  /* 状态条 */
  #status {
    position: absolute;
    bottom: 14px; left: 0; right: 0;
    text-align: center;
    font-family: "Georgia", serif;
    font-style: italic;
    font-size: 13px;
    color: var(--shadow);
    opacity: 0.55;
    letter-spacing: 1px;
    z-index: 5;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  #status.hidden { opacity: 0; }

  /* 设置按钮 */
  #settings-btn {
    position: absolute;
    top: 22px; right: 26px;
    width: 32px; height: 32px;
    border: none;
    background: transparent;
    color: var(--shadow);
    opacity: 0.45;
    font-size: 20px;
    cursor: pointer;
    z-index: 10;
    transition: opacity 0.2s;
  }
  #settings-btn:hover { opacity: 0.95; }

  /* 设置面板 */
  #settings-panel {
    position: absolute;
    inset: 0;
    background: rgba(10,6,6,0.78);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #settings-panel.open { display: flex; }

  #settings-box {
    width: min(560px, 92vw);
    max-height: 90vh;
    overflow-y: auto;
    background:
      linear-gradient(180deg, #e2cda4 0%, var(--parchment) 100%);
    border-radius: 4px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    padding: 32px 36px;
    color: var(--ink);
  }
  #settings-box h2 {
    margin: 0 0 4px;
    font-family: "Georgia", serif;
    font-style: italic;
    font-size: 22px;
    letter-spacing: 3px;
    text-align: center;
  }
  #settings-box .sub {
    text-align: center;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--blood);
    opacity: 0.6;
    margin-bottom: 24px;
  }
  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--shadow);
    margin-bottom: 4px;
    font-style: italic;
  }
  .field input, .field select {
    width: 100%;
    padding: 8px 10px;
    font-size: 13px;
    font-family: "Menlo", monospace;
    background: rgba(255,250,235,0.7);
    border: 1px solid var(--parchment-edge);
    border-radius: 2px;
    color: var(--ink);
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--ember);
    background: rgba(255,250,235,0.95);
  }
  .field .hint {
    font-size: 11px;
    color: var(--shadow);
    opacity: 0.7;
    margin-top: 3px;
    font-style: italic;
  }
  .row {
    display: flex;
    gap: 12px;
  }
  .row > * { flex: 1; }

  .actions {
    margin-top: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .btn {
    font-family: "Georgia", serif;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 8px 22px;
    border: 1px solid var(--shadow);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover { background: rgba(110,84,48,0.12); }
  .btn.primary {
    background: var(--ink);
    color: var(--parchment);
    border-color: var(--ink);
  }
  .btn.primary:hover { background: #2d1a0c; }
  .test-result {
    font-size: 11px;
    color: var(--shadow);
    font-style: italic;
    margin-left: 8px;
  }

  /* 顶角装饰 */
  .corner {
    position: absolute;
    width: 36px; height: 36px;
    z-index: 6;
    pointer-events: none;
    opacity: 0.35;
  }
  .corner.tl { top: 8px; left: 8px; border-top: 2px solid var(--blood); border-left: 2px solid var(--blood); }
  .corner.tr { top: 8px; right: 8px; border-top: 2px solid var(--blood); border-right: 2px solid var(--blood); }
  .corner.bl { bottom: 8px; left: 8px; border-bottom: 2px solid var(--blood); border-left: 2px solid var(--blood); }
  .corner.br { bottom: 8px; right: 8px; border-bottom: 2px solid var(--blood); border-right: 2px solid var(--blood); }

  /* 响应式微调 */
  @media (max-width: 600px) {
    .header .title { font-size: 18px; letter-spacing: 2px; }
    #reply-svg { inset: 50px 30px 40px 30px; width: calc(100% - 60px); height: calc(100% - 90px); }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="scroll">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>

    <div class="header">
      <div class="rule">— PROPRIETIES TOM MARVOLO RIDDLE —</div>
      <div class="title">the diary</div>
    </div>

    <canvas id="ink-canvas"></canvas>
    <svg id="reply-svg" xmlns="http://www.w3.org/2000/svg"></svg>

    <div id="status">awaiting ink…</div>

    <button id="settings-btn" title="settings">⚙</button>
  </div>

  <!-- 设置面板 -->
  <div id="settings-panel">
    <div id="settings-box">
      <h2>The Diary</h2>
      <div class="sub">— SETTINGS —</div>

      <div class="field">
        <label>SILICONFLOW API KEY</label>
        <input id="cfg-api-key" type="password" placeholder="sk-...">
        <div class="hint">
          在 <a href="https://siliconflow.cn" target="_blank" style="color:var(--ember)">siliconflow.cn</a> 注册账号并创建 API key。
          OCR 和对话都走这一个 key,模型在后端固定。
        </div>
      </div>

      <div class="field" style="background:rgba(184,114,43,0.08); padding:10px 12px; border-radius:2px;">
        <label style="color:var(--shadow);">本机使用 / 自部署</label>
        <div style="font-size:12px; color:var(--ink); line-height:1.6;">
          <div>• OCR 模型:<b>Qwen3-VL-8B</b> · 对话模型:<b>DeepSeek V3</b></div>
          <div style="margin-top:4px; color:var(--shadow);">每 IP 每小时限 20 次,防止滥用</div>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="btn-test">测试连接</button>
        <div>
          <span id="test-result" class="test-result"></span>
          <button class="btn" id="btn-close">关闭</button>
          <button class="btn primary" id="btn-save">保存</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- opentype.js 用于把 TTF 解析为 SVG path -->
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>

<script>
'use strict';

// =====================================================================
// 配置（从 localStorage 读）—— 只剩一个 apiKey，模型在后端固定
// =====================================================================
const LS_KEY = 'enchanted-diary-cfg-v1';
const defaultCfg = { apiKey: '' };
let CFG = { ...defaultCfg };
function loadCfg() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      // 自动从旧版本迁移：sfKey / dsKey → apiKey
      if (saved.apiKey == null) {
        saved.apiKey = saved.sfKey || saved.dsKey || '';
      }
      CFG = { ...defaultCfg, ...saved };
    }
  } catch (e) { console.warn('config load failed', e); }
}
function saveCfg() {
  localStorage.setItem(LS_KEY, JSON.stringify(CFG));
  return CFG;
}

// =====================================================================
// PERSONA 现在在后端 src/providers/siliconflow.js 里（部署时统一管理）
// 前端不再存 prompt，避免重复维护
// =====================================================================

// =====================================================================
// DOM
// =====================================================================
const canvas = document.getElementById('ink-canvas');
const ctx = canvas.getContext('2d');
const svg = document.getElementById('reply-svg');
const statusEl = document.getElementById('status');
const settingsBtn = document.getElementById('settings-btn');
const settingsPanel = document.getElementById('settings-panel');

// =====================================================================
// 高 DPI canvas 适配
// =====================================================================
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.floor(rect.width * dpr);
  canvas.height = Math.floor(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);

// =====================================================================
// 笔触状态
// =====================================================================
let drawing = false;
let strokes = [];          // [{points:[[x,y,pressure], ...]}]
let currentStroke = null;
let lastInkTime = 0;
const IDLE_MS = 2800;

// 笔刷：模拟蘸水钢笔，压感影响宽度和墨量
function drawStroke(s) {
  if (s.points.length < 1) return;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(31, 17, 8, 0.92)';

  if (s.points.length === 1) {
    const [x, y, p] = s.points[0];
    ctx.fillStyle = 'rgba(31, 17, 8, 0.92)';
    ctx.beginPath();
    ctx.arc(x, y, 1 + p * 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return;
  }

  // 分段：每段宽度按平均压感过渡
  for (let i = 1; i < s.points.length; i++) {
    const [x0, y0, p0] = s.points[i - 1];
    const [x1, y1, p1] = s.points[i];
    const w = 0.6 + ((p0 + p1) / 2) * 2.8;
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }
  ctx.restore();
}

function redrawAll() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const s of strokes) drawStroke(s);
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  let clientX, clientY, pressure = 0.5;
  if (e.touches && e.touches[0]) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
    // Pointer Events 在支持压感的设备上会带 pressure
    if (typeof e.pressure === 'number') pressure = e.pressure || 0.5;
  }
  return {
    x: clientX - rect.left,
    y: clientY - rect.top,
    pressure: Math.max(0.1, Math.min(1, pressure)),
  };
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  drawing = true;
  const { x, y, pressure } = getPos(e);
  currentStroke = { points: [[x, y, pressure]] };
  strokes.push(currentStroke);
  drawStroke(currentStroke);
  lastInkTime = performance.now();
  // 用户落笔 → 把任何正在进行的回复推进到 fade
  if (state.kind === 'lingering') {
    state = { kind: 'fading', stage: 0, region: state.region };
  }
});
canvas.addEventListener('pointermove', (e) => {
  if (!drawing) return;
  e.preventDefault();
  const { x, y, pressure } = getPos(e);
  const pts = currentStroke.points;
  const last = pts[pts.length - 1];
  // 跳过抖动太小的点
  if (Math.hypot(x - last[0], y - last[1]) < 0.8) return;
  pts.push([x, y, pressure]);
  drawStroke(currentStroke);
  lastInkTime = performance.now();
});
function penUp() {
  if (!drawing) return;
  drawing = false;
  currentStroke = null;
  lastInkTime = performance.now();
}
canvas.addEventListener('pointerup', penUp);
canvas.addEventListener('pointercancel', penUp);
canvas.addEventListener('pointerleave', penUp);

// =====================================================================
// 状态机（Listening → Drinking → Thinking → Replying → Lingering → Fading）
// =====================================================================
let state = { kind: 'listening' };
let idleTimer = null;
let phaseTimer = null;
let inFlight = null;     // AbortController for current oracle call
let inkSnapshot = null;  // 墨水快照（fade 期间让回复有空间写入）

function setStatus(text) {
  statusEl.textContent = text;
  statusEl.classList.remove('hidden');
}
function hideStatus() {
  statusEl.classList.add('hidden');
}

function scheduleIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (state.kind !== 'listening') return;
    if (strokes.length === 0) return;
    startDrinking();
  }, IDLE_MS);
}

function startDrinking() {
  state = { kind: 'drinking', stage: 0, next: performance.now() + 600 };
  setStatus('the diary drinks the ink…');
  // 拍快照：取一张墨迹图，后面 OCR 用（在 fade 开始之前）
  inkSnapshot = canvas.toDataURL('image/png');
  // 用 CSS 滤镜直接作用于画布，做更柔和的褪色
  canvas.style.transition = 'filter 0.5s ease';
  canvas.style.filter = 'blur(0px) brightness(1)';
  tickDrinking();
}

function tickDrinking() {
  if (state.kind !== 'drinking') return;
  const now = performance.now();
  if (now < state.next) {
    phaseTimer = requestAnimationFrame(tickDrinking);
    return;
  }
  state.stage += 1;

  // 五阶段"被吸走"动画：逐渐模糊 + 变暗 + 淡化
  // 用 filter 比每帧重绘整张 canvas 流畅得多
  const s = state.stage;
  const blur = Math.min(4, s * 0.9);
  const bright = 1 - s * 0.12;        // 1.0 → 0.4
  const opacity = 1 - s * 0.22;       // 1.0 → 0.12
  canvas.style.filter = `blur(${blur}px) brightness(${bright})`;
  canvas.style.opacity = String(Math.max(0.05, opacity));

  if (s < 5) {
    state.next = now + 280;
    phaseTimer = requestAnimationFrame(tickDrinking);
  } else {
    // 清空画布，回到 listening
    strokes = [];
    redrawAll();
    canvas.style.transition = 'none';
    canvas.style.filter = 'none';
    canvas.style.opacity = '1';
    startThinking();
  }
}

async function startThinking() {
  if (!CFG.apiKey) {
    setStatus('请先在 ⚙ 中填入 SiliconFlow API key');
    state = { kind: 'listening' };
    scheduleIdle();
    return;
  }
  state = { kind: 'thinking', pulse: performance.now(), blotOn: true };
  setStatus('the diary is thinking…');
  // OCR + 对话 都在后端 /api/oracle 里做了 —— 直接发图
  startReplying(inkSnapshot);
}

// 压缩 OCR 用截图：铺白底（画布原本透明）→ 最长边 1024 → JPEG 0.8
function compressForOcr(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        const MAX = 1024;
        const scale = Math.min(1, MAX / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.8));
      } catch (e) { reject(e); }
    };
    img.onerror = () => reject(new Error('snapshot image decode failed'));
    img.src = dataUrl;
  });
}
// =====================================================================
// 单端点调用：POST /api/oracle { image, apiKey } → SSE 流
// 后端负责 OCR + DeepSeek 对话，前端只管把流逐字动画写出来
// =====================================================================
async function startReplying(imageDataUrl) {
  try {
    imageDataUrl = await compressForOcr(imageDataUrl);
  } catch (e) {
    console.warn('[riddle] compress failed, sending original:', e);
  }
  console.log('[riddle] /api/oracle, image bytes ~', Math.floor(imageDataUrl.length * 0.75));

  // 在手机/平板上解析 5MB+ 中文字体需要 2-5 秒。如果不等字体加载完就
  // 开始动画，第一批到达的中文字会显示成豆腐块（字体没就绪）。
  // 这里先把字体 fetch 完再发请求，避免竞态。
  setStatus('preparing the ink…');
  try {
    await loadFonts();
  } catch (e) {
    console.error('font load failed', e);
    setStatus('字体加载失败: ' + e.message);
    state = { kind: 'listening' };
    scheduleIdle();
    return;
  }

  setStatus('Tom writes back…');
  clearReply();

  let resp;
  let lastErr;
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      console.log(`[riddle] oracle attempt ${attempt}/3`);
      resp = await fetch('/api/oracle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: imageDataUrl, apiKey: CFG.apiKey }),
      });
      break;
    } catch (e) {
      console.warn(`[riddle] oracle attempt ${attempt} failed:`, e);
      lastErr = e;
      if (attempt < 3) await new Promise(r => setTimeout(r, 600 * attempt));
    }
  }
  if (!resp) {
    setStatus('连接失败(已重试3次): ' + (lastErr?.message || 'unknown'));
    state = { kind: 'listening' };
    scheduleIdle();
    return;
  }
  if (!resp.ok) {
    const txt = await resp.text();
    let detail = txt.slice(0, 300);
    try {
      const j = JSON.parse(txt);
      if (j.error) detail = j.error + (j.detail ? ': ' + j.detail.slice(0, 100) : '');
    } catch {}
    if (resp.status === 401) {
      setStatus('SiliconFlow API key 无效');
    } else if (resp.status === 422) {
      setStatus('the ink blurred — ' + detail);
    } else if (resp.status === 429) {
      setStatus('每 IP 每小时限 20 次,稍后再试');
    } else {
      setStatus('oracle http ' + resp.status + ': ' + detail);
    }
    state = { kind: 'listening' };
    scheduleIdle();
    return;
  }

  state = { kind: 'replying', full: '', cursorY: 90 };
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let pendingText = '';

  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const raw of lines) {
        const line = raw.trim();
        if (!line || !line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') continue;
        let delta = '';
        try {
          const j = JSON.parse(payload);
          delta = j.choices?.[0]?.delta?.content || '';
        } catch (e) { continue; }
        if (!delta) continue;

        state.full += delta;
        pendingText += delta;
        if (state.full.length < 80) console.log('[riddle] delta:', JSON.stringify(delta));

        // 每累积够一段"句子"就触发渲染
        const cutMatch = pendingText.match(/^(.*?[.!?。！？…])\s*(.*)$/s);
        if (cutMatch) {
          const chunk = cutMatch[1];
          pendingText = cutMatch[2] || '';
          console.log('[riddle] sentence:', JSON.stringify(chunk));
          state.cursorY = await appendHandwrittenChunk(chunk, state.cursorY);
        }
      }
    }
    if (pendingText.trim()) {
      state.cursorY = await appendHandwrittenChunk(pendingText, state.cursorY);
    }
  } catch (e) {
    console.warn('stream interrupted', e);
    setStatus('流中断: ' + (e.message || e) + '（已收到 ' + state.full.length + ' 字）');
  }

  // 回复完成 → 等待淡出
  state = { kind: 'lingering', since: performance.now() };
  setTimeout(() => {
    if (state.kind === 'lingering') {
      state = { kind: 'fading', stage: 0 };
      setStatus('the ink fades…');
      tickReplyFade();
    }
  }, 4500);
}

function tickReplyFade() {
  if (state.kind !== 'fading') return;
  state.stage += 1;
  // 整个 svg 渐隐
  svg.style.transition = 'opacity 0.9s ease';
  svg.style.opacity = String(Math.max(0, 1 - state.stage * 0.33));
  if (state.stage < 3) {
    setTimeout(tickReplyFade, 900);
  } else {
    clearReply();
    state = { kind: 'listening' };
    setStatus('awaiting ink…');
    scheduleIdle();
  }
}

function clearReply() {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  svg.style.opacity = '1';
}

// =====================================================================
// 手写动画：用 opentype.js 把 TTF 解析为 path，
// 然后用 stroke-dasharray + stroke-dashoffset 让笔迹"画出来"
// =====================================================================
// 加载两个字体：英文 / 手写 → Dancing Script，中文 → Ma Shan Zheng（演示夏行楷）
let fontsReady = null;  // Promise<{latin, cjk}>
function loadFonts() {
  if (fontsReady) return fontsReady;
  fontsReady = Promise.all([
    fetch('DancingScript.ttf').then(r => r.arrayBuffer()).then(b => opentype.parse(b)),
    fetch('MaShanZheng-Regular.ttf').then(r => r.arrayBuffer()).then(b => opentype.parse(b)),
  ]).then(([latin, cjk]) => ({ latin, cjk }));
  return fontsReady;
}

// 判断一个字符是不是 CJK（中文/日文/韩文 + 全角符号）
function isCJK(ch) {
  const cp = ch.codePointAt(0);
  return (cp >= 0x3000 && cp <= 0x303F)    // CJK 标点
      || (cp >= 0x3400 && cp <= 0x4DBF)    // CJK Extension A
      || (cp >= 0x4E00 && cp <= 0x9FFF)    // CJK 基本
      || (cp >= 0xFF00 && cp <= 0xFFEF);   // 全角
}

// 一段文字渲染到 svg 的指定 (x,y) 起点，返回 Promise<{ finalY: number }>
function renderHandwriting(text, x, y, fontSize) {
  console.log('[riddle] renderHandwriting:', JSON.stringify(text.slice(0, 40)), 'fontSize=', fontSize, 'startY=', y);
  return loadFonts().then((fonts) => {
    return new Promise((resolve) => {
      const FONT_PX = fontSize;
      const LINE_H = FONT_PX * 1.4;   // 行高：比字大 40%，手写体需要宽松一点
      const writeWidth = getWriteWidth();
      console.log('[riddle] writeWidth=', writeWidth, 'lineH=', LINE_H);

      const lines = wrapTextMixed(text, fonts, FONT_PX, writeWidth);
      console.log('[riddle] wrapped into', lines.length, 'lines');

      let cursorY = y + FONT_PX;   // 首行基线 = 起始位置向下偏移一个字高
      let allStrokes = [];

      for (const line of lines) {
        let cursorX = x;
        for (const run of line.runs) {
          const font = run.font;
          const emToPx = FONT_PX / font.unitsPerEm;
          let prevGlyph = null;
          for (const ch of run.chars) {
            const glyph = font.charToGlyph(ch);
            const advance = glyph.advanceWidth;
            if (prevGlyph) {
              cursorX += font.getKerningValue(prevGlyph, glyph) * emToPx;
            }
            const path = glyph.getPath(cursorX, cursorY, FONT_PX);
            const d = path.toPathData(2);
            if (d && d.trim()) {
              const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
              el.setAttribute('d', d);
              // 兜底 fill: 即便 stroke 渲染失败,字形也还在（避免手机方框）
              el.setAttribute('fill', '#1f1108');
              el.setAttribute('fill-opacity', '0.05');
              el.setAttribute('stroke', '#1f1108');
              el.setAttribute('stroke-width', isCJK(ch) ? '2.2' : '1.6');
              el.setAttribute('stroke-linecap', 'round');
              el.setAttribute('stroke-linejoin', 'round');
              el.setAttribute('opacity', '0.95');
              el.style.visibility = 'hidden';
              svg.appendChild(el);
              const len = el.getTotalLength();
              if (len > 0) {
                el.style.strokeDasharray = len;
                el.style.strokeDashoffset = len;
              }
              allStrokes.push({ el, len });
            }
            cursorX += advance * emToPx;
            prevGlyph = glyph;
          }
        }
        cursorY += LINE_H;
      }
      console.log('[riddle] created', allStrokes.length, 'paths, finalY=', cursorY);

      if (allStrokes.length === 0) {
        setStatus('空内容: 没有可绘制的字形');
        resolve({ finalY: y + FONT_PX });
        return;
      }

      let i = 0;
      const totalDuration = Math.min(2800, Math.max(900, allStrokes.length * 90));
      const perStroke = Math.max(110, totalDuration / Math.max(1, allStrokes.length));
      function playNext() {
        if (i >= allStrokes.length) {
          // 全部画完后,把 fill 提到 1.0 让字形完全可见（兜底）
          for (const s of allStrokes) {
            s.el.setAttribute('fill-opacity', '1');
          }
          console.log('[riddle] animation complete');
          resolve({ finalY: cursorY });
          return;
        }
        const { el, len } = allStrokes[i++];
        if (len === 0) {
          setTimeout(playNext, 0);
          return;
        }
        el.style.transition = 'none';
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
        el.style.visibility = 'visible';
        el.getBBox();
        el.getBoundingClientRect();
        el.style.transition = `stroke-dashoffset ${perStroke}ms cubic-bezier(.55,.05,.45,1)`;
        el.getBoundingClientRect();
        el.style.strokeDashoffset = '0';
        setTimeout(playNext, perStroke + 25);
      }
      playNext();
    });
  });
}

// 把混合文本切成"行"，每行内部按字体分段
//   lines: [{ runs: [{ font, chars: 'abc' }, { font: cjk, chars: '你好' }] }, ...]
function wrapTextMixed(text, fonts, fontPx, maxPx) {
  const { latin, cjk } = fonts;
  const latinEm = fontPx / latin.unitsPerEm;
  const cjkEm = fontPx / cjk.unitsPerEm;

  // 切成 tokens：中文字符 / 英文单词 / 标点 / 空白
  const tokens = text.match(/[一-鿿　-〿＀-￯]|[A-Za-z0-9']+|[^A-Za-z0-9'　-〿＀-￯一-鿿]+|\s+/g) || [text];

  // 每个 token 选字体（基于首字符）
  function fontOfToken(tok) {
    return isCJK(tok[0]) ? cjk : latin;
  }
  // 测量单个 token 在指定字体下的宽度
  function measureTok(tok, font, em) {
    let w = 0;
    for (const ch of tok) {
      w += font.charToGlyph(ch).advanceWidth * em;
    }
    return w;
  }
  // 测量"当前行累计宽度"
  function measureRuns(runs) {
    let w = 0;
    for (const r of runs) {
      const em = r.font === latin ? latinEm : cjkEm;
      w += measureTok(r.chars, r.font, em);
    }
    return w;
  }

  const lines = [];
  let curRuns = []; // [{ font, chars }]

  for (const tok of tokens) {
    // 空白 token 跨字体保持：尽量保留在原 run 里，仅用于分隔
    if (/^\s+$/.test(tok)) {
      // 把空白附加到当前 run 的 chars 里（不切字体，避免破坏视觉）
      if (curRuns.length) curRuns[curRuns.length - 1].chars += tok;
      continue;
    }
    const font = fontOfToken(tok);
    const cand = curRuns.concat([{ font, chars: tok }]);
    const w = measureRuns(cand);
    if (w > maxPx && curRuns.length) {
      lines.push({ runs: curRuns });
      curRuns = [{ font, chars: tok.trimStart() }];
    } else {
      curRuns = cand;
    }
  }
  if (curRuns.length) lines.push({ runs: curRuns });
  return lines;
}

function getWriteWidth() {
  // svg 的内宽
  const r = svg.getBoundingClientRect();
  return r.width;
}

async function appendHandwrittenChunk(chunk, startY) {
  let y = startY || 90;
  const fontSize = Math.min(38, Math.max(24, getWriteWidth() / 32));
  let result;
  try {
    result = await renderHandwriting(chunk, 0, y, fontSize);
  } catch (e) {
    console.error('render failed for chunk:', chunk, e);
    setStatus('渲染失败: ' + (e.message || e));
    return y + fontSize * 1.4;  // 即使出错也推进一点，避免重叠
  }
  // 使用 renderHandwriting 返回的精确最终位置
  return result ? result.finalY : y + fontSize * 1.4;
}

// =====================================================================
// 设置面板（单 key 模式：只用 SiliconFlow 一个 key）
// =====================================================================
function openSettings() {
  document.getElementById('cfg-api-key').value = CFG.apiKey || '';
  document.getElementById('test-result').textContent = '';
  settingsPanel.classList.add('open');
}
function closeSettings() {
  settingsPanel.classList.remove('open');
}

settingsBtn.addEventListener('click', openSettings);
document.getElementById('btn-close').addEventListener('click', closeSettings);
document.getElementById('btn-save').addEventListener('click', () => {
  CFG.apiKey = document.getElementById('cfg-api-key').value.trim();
  saveCfg();
  closeSettings();
});

// 测试连接：发一个最小请求到 /api/oracle 验证 key
document.getElementById('btn-test').addEventListener('click', async () => {
  const result = document.getElementById('test-result');
  result.textContent = 'testing…';
  const apiKey = document.getElementById('cfg-api-key').value.trim();
  if (!apiKey) {
    result.textContent = '✗ 先填 key';
    return;
  }
  // 用一个 1×1 透明 PNG 当 image
  const tinyPng =
    'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';
  try {
    const r = await fetch('/api/oracle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: tinyPng, apiKey }),
    });
    if (r.status === 422) {
      result.textContent = '✓ key 有效(空白图返回 illegible)';
    } else if (r.status === 401) {
      result.textContent = '✗ key 无效';
    } else if (r.ok) {
      result.textContent = '✓ key 有效';
    } else {
      const t = await r.text();
      result.textContent = '✗ ' + r.status + ': ' + t.slice(0, 80);
    }
  } catch (e) {
    result.textContent = '✗ ' + e.message;
  }
});

// =====================================================================
// 启动
// =====================================================================
loadCfg();
resizeCanvas();
// 启动 idle 监控
scheduleIdle();
// 全局落笔时也喂 idle
canvas.addEventListener('pointerdown', scheduleIdle);
canvas.addEventListener('pointermove', () => {
  if (drawing) scheduleIdle();
});

// 防止移动端滚动
['touchstart', 'touchmove'].forEach(ev =>
  document.addEventListener(ev, e => { if (e.target === canvas) e.preventDefault(); }, { passive: false })
);
</script>
